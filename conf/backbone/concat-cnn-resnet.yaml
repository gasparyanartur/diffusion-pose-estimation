# ConcatFeatureExtractor example: fuses CNN (stride-16) and ResNet18/layer3 (stride-16).
# Each modality is projected to dim=256 then concatenated into a token sequence.
_target_: src.features.ConcatFeatureExtractorConfig
dim: 256
feature_key: spatial
backbones:
  - _target_: src.features.CNNFeatureExtractorConfig
    out_channels: 128
  - _target_: src.features.ResNetFeatureExtractorConfig
    variant: resnet18
    output_layer: layer3
    pretrained: true
