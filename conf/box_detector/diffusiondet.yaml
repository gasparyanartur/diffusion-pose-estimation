# DiffusionDet detector config — trained on CrowdPose (person detection).
#
# Requires Detectron2 to be installed in the current environment.
# See external/diffusiondet/GETTING_STARTED.md for setup instructions.
#
# Train the checkpoint first:
#   bash scripts/train_diffusiondet_crowdpose.sh
# Then copy the output:
#   cp results/diffusiondet_crowdpose/model_final.pth checkpoints/diffdet_crowdpose_res50.pth

_target_: src.models.pipelines.object_detectors.diffusiondet.DiffusionDetConfig

config_file: external/diffusiondet/configs/diffdet.crowdpose.res50.yaml
checkpoint: checkpoints/diffdet_crowdpose_res50.pth
score_threshold: 0.3
max_detections: 100
device: cuda
