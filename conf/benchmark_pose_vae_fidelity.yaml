defaults:
  - hardware: auto
  - training: default
  - _self_

run_name: pose_vae_fidelity
out_dir: results/pose_vae_fidelity
initial_checkpoint: ???
initialization_file: null

hardware:
  devices: 1
  precision: 32

data:
  train_ann: data/crowdpose/annotations/crowdpose_train.json
  val_ann: data/crowdpose/annotations/crowdpose_val.json
  test_ann: data/crowdpose/annotations/crowdpose_test.json
  batch_size: 512
  num_workers: 0
  subset_frac: 1.0

pipeline:
  mode: sampled
  kl_fraction: 0.01
  mask_max: 0.3
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.0001
  kl_warmup_epochs: 10
  seed: ${training.seed}

training:
  max_epochs: 100
  check_val_every_n_epoch: 5
  grad_clip: 1.0
  seed: 42
  test_after_fit: false
  enable_progress_bar: false
  log_every_n_steps: 10
  checkpoint:
    monitor: val/selection_score
    mode: max
    filename: 'epoch{epoch:03d}-score{val/selection_score:.4f}'
    save_top_k: 1
    save_last: true
    save_last_every_epoch: true
  logging:
    logger_name: pose_vae_fidelity

hydra:
  run:
    dir: ${out_dir}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false
