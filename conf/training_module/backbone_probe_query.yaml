# QueryProbe config for scripts/benchmark_backbone.py
#
# Uses DETR-style instance + joint cross-attention instead of the ConvNeXt
# pooling stack.  Swap in with: training_module=backbone_probe_query
_target_: src.training.training_config.QueryBackboneProbeConfig

lr: 4e-4
weight_decay: 1e-3
cosine_lr: true
lr_warmup_epochs: 1
lr_min_frac: 1e-1

max_epochs: 100
seed: 42
grad_clip: 5.0
log_every_n_steps: 50
resume: null
gt_sanity_check: false

# QueryProbe
feature_dim: 256
num_slots: 20
num_heads: 4
ffn_mult: 2
attn_dropout: 0.0
ffn_dropout: 0.1
proj_dropout: 0.1
feature_key: spatial
predict_visibility: false

# Augmentation (pixel-space only, no spatial transforms)
noise_std: 0.05
brightness: 0.3
contrast: 0.3
saturation: 0.2

# Periodic AP evaluation
val_ap_every_n_epochs: 10

weights:
  oks: 2.0
  obj: 1.0
  vis: 0.0
  rank: 1.0
  matcher_lambda_oks: 1.0
  matcher_lambda_obj: 0.1
