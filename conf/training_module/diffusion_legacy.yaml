# Legacy SOTA training preset (matches commit 1451292).
#
# Reproduces the pre-refactor hyper-parameters of the message-passing SOTA run:
#   - LR 3e-4 with cosine schedule and lr_min_frac=0.1
#   - 200 epochs, grad_clip=1.0
#   - Augmentations:  jitter px=16, joint-drop p=0.2, pose-drop p=0.1,
#                     joint-rand p=0.15, image-drop p=0.1
#   - Loss weights kept at the original 1e-5 (Adam normalises; preserved for
#     bit-for-bit reproducibility of the old config).
#   - In-training AP eval at end (interval=100), passes ∈ {1,2,3}, 5 DDIM steps.
#
# Pair with `pose_estimator=dino_diffusion_legacy` and `data=crowdpose`.

_target_: src.training.DiffusionTrainingModuleConfig

# optimiser / schedule
lr: 3e-4
weight_decay: 1e-4
cosine_lr: true
lr_warmup_epochs: 0
lr_min_frac: 0.1
cfg_guidance_scale: 1.0

# AP / inference (matches old `train.*` block)
num_inference_steps: 5
ap_eval_interval: 100
ap_step_counts: [1, 2, 3]
start_inference_noise_frac: 0.4
raw_refiner: false
disable_noise: false

# trainer-level
max_epochs: 200
seed: 42
grad_clip: 1.0
early_stop_patience: 0
log_every_n_steps: 50
compile: false
running_loss_window: 5
resume: null

augmentations:
  aug_jitter: true
  p_jitter_px: 16.0
  aug_joint_drop: true
  p_joint_drop: 0.2
  aug_pose_drop: true
  p_pose_drop: 0.1
  aug_joint_rand: true
  p_joint_rand: 0.15
  aug_img_drop: true
  p_img_drop: 0.1

losses:
  use_joint_loss: true
  w_joint_loss: 1.0e-5
  use_bone_loss: true
  w_bone_loss: 1.0e-5
