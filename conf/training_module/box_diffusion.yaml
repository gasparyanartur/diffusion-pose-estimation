# BoxSetDiffusionModuleConfig — set-prediction box diffusion training preset.
#
# Pairs with `conf/decoder/box_set.yaml` and `conf/benchmark_box_diffusion.yaml`.
# Override on the CLI:
#   training_module.lr=3e-4 training_module.max_epochs=200
_target_: src.training.BoxSetDiffusionModuleConfig

# optimiser / schedule
lr: 2e-4
weight_decay: 1e-4
cosine_lr: true
lr_warmup_epochs: 1
lr_min_frac: 1e-2

# trainer
max_epochs: 100
seed: 42
grad_clip: 1.0
log_every_n_steps: 50
resume: null

# diffusion
sigma_min: 0.002
sigma_max: 1.0
rho: 7.0
num_inference_steps: 5
val_ap_every_n_epochs: 10

feature_key: spatial

# augmentation (pixel-space + hflip)
noise_std: 0.02
brightness: 0.2
contrast: 0.2
saturation: 0.1
hflip_p: 0.5

weights:
  l1: 5.0
  giou: 2.0
  diff_l2: 1.0
  obj_bce: 1.0
  matcher_lambda_l1: 5.0
  matcher_lambda_giou: 2.0
  matcher_lambda_obj: 0.1
