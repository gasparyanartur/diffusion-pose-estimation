# Minimal training preset — fastest possible end-to-end smoke run.
# Pair with `data=crowdpose_minimal` to also shrink the batch / loader.

defaults:
  - diffusion
  - _self_

max_epochs: 2
ap_eval_interval: 0
num_inference_steps: 1
log_every_n_steps: 1
compile: false
early_stop_patience: 0
running_loss_window: 1

augmentations:
  aug_jitter: false
  p_jitter_px: 0.0
  aug_joint_drop: false
  p_joint_drop: 0.0
  aug_pose_drop: false
  p_pose_drop: 0.0
  aug_joint_rand: false
  p_joint_rand: 0.0
  aug_img_drop: false
  p_img_drop: 0.0

losses:
  use_joint_loss: true
  w_joint_loss: 1.0
  use_bone_loss: false
  w_bone_loss: 0.0
