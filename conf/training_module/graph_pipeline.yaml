# Compatibility config for the one-stage graph diffusion pose module.
#
# Pairs with conf/decoder/graph_pipeline.yaml and conf/benchmark_graph_pipeline.yaml.
# Override on the CLI:
#   training_module.lr=3e-4 training_module.max_epochs=200
_target_: src.training.graph_pipeline_module.GraphDiffusionOnestageModuleConfig

# optimiser / schedule
lr: 2e-4
weight_decay: 1e-4
cosine_lr: true
lr_warmup_epochs: 1
lr_min_frac: 1e-2

# trainer
max_epochs: 100
seed: 42
grad_clip: 1.0
resume: null

# diffusion
sigma_min: 0.002
sigma_max: 10.0
rho: 7.0
num_inference_steps: 5
sigma_p_mean: -1.2
sigma_p_std: 1.2
val_ap_every_n_epochs: 10

# augmentation
noise_std: 0.02
brightness: 0.2
contrast: 0.2
saturation: 0.1

weights:
  box_l1: 5.0
  box_giou: 2.0
  box_l2: 1.0
  kpt_l2: 5.0
  obj_bce: 1.0
  rank: 1.0
