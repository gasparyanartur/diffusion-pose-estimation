defaults:
  - default
  - _self_

max_epochs: 100
grad_clip: 0.1
accumulate_grad_batches: 1
precision: 32
limit_val_batches: 1.0
test_after_fit: false

checkpoint:
  monitor: val/loss
  mode: min
  filename: "epoch{epoch:03d}-val_loss{val/loss:.4f}"
  save_top_k: 1
  save_last: true
  save_last_every_epoch: true
  every_n_epochs: null
  final_epoch: false
