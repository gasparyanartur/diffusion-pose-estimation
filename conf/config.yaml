# Root Hydra config. Override any value from the command line:
#
#   python scripts/train_pose_refinement.py run_name=exp1
#   python scripts/train_pose_refinement.py pose_estimator=dino_bilinear
#   python scripts/train_pose_refinement.py training_module.lr=3e-4 training_module.max_epochs=200
#   python scripts/train_pose_refinement.py training_module=diffusion_minimal data=crowdpose_minimal

defaults:
  - pose_estimator: default
  - training_module: diffusion
  - data: crowdpose
  - hardware: auto
  - _self_

run_name: pose_estimator
out_dir: results/pose_estimator_training

hydra:
  run:
    dir: ${out_dir}/${run_name}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false
