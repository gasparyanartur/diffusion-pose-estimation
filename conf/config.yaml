# Root Hydra config. Override any value from the command line:
#
#   python scripts/train_pose_refinement.py run_name=exp1
#   python scripts/train_pose_refinement.py pipeline.lr=3e-4 pipeline.max_epochs=200
#
# The default project model is fixed-slot pose prediction: image → person slots
# → keypoints.

defaults:
  - pipeline: baseline_pose
  - data: crowdpose_set_prediction
  - hardware: auto
  - _self_

run_name: pose_estimator
out_dir: results/pose_estimator_training

hydra:
  run:
    dir: ${out_dir}/${run_name}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false
