# Hydra root config for scripts/train_box_diffusion.py
#
# Architecture: BoxDiffusionPipeline (backbone + EDM box denoiser + Lightning
# lifecycle) over a DETR-style matched set of bounding boxes.
#
# Examples:
#   python scripts/train_box_diffusion.py
#   python scripts/train_box_diffusion.py pipeline.max_epochs=200
#   python scripts/train_box_diffusion.py data=crowdpose_debug \
#       pipeline.max_epochs=2 pipeline.val_ap_every_n_epochs=1
#   python scripts/train_box_diffusion.py skip_training=true \
#       pipeline.resume=results/.../checkpoints/last.ckpt

defaults:
  - pipeline: box_diffusion
  - data: crowdpose_set_prediction
  - hardware: auto
  - _self_

run_name: box_diffusion_benchmark
out_dir: results/box_diffusion_benchmark

skip_training: false
compile: false

hydra:
  run:
    dir: ${out_dir}/${run_name}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false
