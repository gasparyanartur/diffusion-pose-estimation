_target_: src.models.pipelines.pose_estimators.poseflow.PoseFlowPipelineConfig

defaults:
  - diffusionregpose_development_compatible
  - _self_

matching_strategy: ota
ota_candidate_topk: 5
flow_padding_policy: source_prior
flow_sampling_steps: 1

# Match the active 256-pixel OTA control: selected one-based EDPose layers
# 2/4/6 become a 3E/3D network with one box and two pose stages.
num_encoder_layers: 3
num_decoder_layers: 3
num_box_decoder_layers: 1
pretrained_keep_encoder_layers: [2, 4, 6]
pretrained_keep_decoder_layers: [2, 4, 6]
