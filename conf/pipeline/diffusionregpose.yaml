_target_: src.models.pipelines.pose_estimators.diffusionregpose.DiffusionRegPosePipelineConfig

backbone_pretrained: true
timesteps: 1000
sampling_timesteps: 1
num_queries: 900
num_proposals: 100
num_classes: 2
num_feature_levels: 4
num_encoder_layers: 6
num_decoder_layers: 6
hidden_dim: 256
num_heads: 8
num_body_points: 14
num_box_decoder_layers: 2
num_group: 100

lr: 2.0e-4
weight_decay: 1.0e-4
lr_warmup_epochs: 1
lr_min_frac: 1.0e-2

weights:
  cls: 2.0
  bbox: 5.0
  giou: 2.0
  keypoints: 1.0
  oks: 4.0
  set_cost_class: 2.0
  set_cost_bbox: 5.0
  set_cost_giou: 2.0
  set_cost_keypoints: 10.0
  set_cost_oks: 4.0
  focal_alpha: 0.25
