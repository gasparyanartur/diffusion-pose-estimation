_target_: src.models.pipelines.object_detectors.box_diffusion.BoxDiffusionPipelineConfig

backbone:
  _target_: src.models.features.cnn.CNNFeatureExtractorConfig
  out_channels: 128

lr: 2e-4
weight_decay: 1e-4
cosine_lr: true
lr_warmup_epochs: 1
lr_min_frac: 1e-2
sigma_min: 0.002
sigma_max: 10.0
rho: 7.0
num_inference_steps: 5
sigma_p_mean: -1.2
sigma_p_std: 1.2
val_ap_every_n_epochs: 10
feature_key: spatial

noise_std: 0.02
brightness: 0.2
contrast: 0.2
saturation: 0.1
hflip_p: 0.5

num_slots: 20
dim: 512
num_heads: 8
num_blocks: 3
num_obj_blocks: 1
num_box_branch_blocks: 1
num_box_refine_blocks: 1
obj_dim: 256
box_dim: 256
time_dim: 256
ffn_mult: 4.0
fourier_box_bands: 16
fourier_box_scale: 1000.0
fourier_sigma_bands: 16
fourier_sigma_scale: 100.0
sigma_log_offset: 1.0e-4
pe_scale: 1000.0
self_cond: true

weights:
  l1: 5.0
  giou: 2.0
  diff_l2: 1.0
  obj_bce: 1.0
  rank: 1.0
  matcher_lambda_l1: 5.0
  matcher_lambda_giou: 2.0
  matcher_lambda_obj: 0.1
