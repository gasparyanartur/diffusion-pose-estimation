defaults:
  - pipeline: poseflow_v12
  - data: crowdpose_diffusionregpose_development_256
  - hardware: auto
  - training: diffusionregpose_development
  - _self_

run_name: poseflow_v12_training
out_dir: results/poseflow_v12_training
skip_training: false

data:
  batch_size: 4

training:
  accumulate_grad_batches: 2

hydra:
  run:
    dir: ${out_dir}/${run_name}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false
