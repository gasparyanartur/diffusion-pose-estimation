# Query-probe config for scripts/investigation/benchmark_backbone.py.
_target_: src.models.pipelines.pose_estimators.backbone_probe.QueryBackboneProbeConfig

lr: 4e-4
weight_decay: 1e-3
cosine_lr: true
lr_warmup_epochs: 1
lr_min_frac: 1e-1
gt_sanity_check: false
feature_dim: 256
num_slots: 20
num_heads: 4
ffn_mult: 2
attn_dropout: 0.0
ffn_dropout: 0.1
proj_dropout: 0.1
feature_key: spatial
pe_scale: 1000.0
predict_visibility: false
noise_std: 0.05
brightness: 0.3
contrast: 0.3
saturation: 0.2
val_ap_every_n_epochs: 10
weights:
  oks: 2.0
  obj: 1.0
  vis: 0.0
  rank: 1.0
  matcher_lambda_oks: 1.0
  matcher_lambda_obj: 0.1
