# AttentionDinoConditioner using DINOv3 ConvNeXt-Small features.
# Cross-attention over all stage1+stage4 patches instead of nearest-patch lookup.
#
# Run precompute_dino.py with --backbone-type convnext to generate the caches.
model_name: facebook/dinov3-convnext-small-pretrain-lvd1689m
backbone_type: convnext
cache_train: results/cache/crowdpose/facebook_dinov3-convnext-small-pretrain-lvd1689m/train
cache_val: results/cache/crowdpose/facebook_dinov3-convnext-small-pretrain-lvd1689m/val
cache_test: results/cache/crowdpose/facebook_dinov3-convnext-small-pretrain-lvd1689m/test
neighborhood_radius: 1
conditioner_type: attention
inner_dim: 256
num_heads: 4
