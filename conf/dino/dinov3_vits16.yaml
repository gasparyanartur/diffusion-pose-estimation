# DINOv3 ViT-S/16 image conditioning.
# Set cache_train / cache_val to precomputed .pt files to avoid running
# the backbone live (see scripts/precompute_dino.py).
model_name: facebook/dinov3-vits16-pretrain-lvd1689m
cache_train: results/cache/crowdpose/facebook_dinov3-vits16-pretrain-lvd1689m/train.pt
cache_val: results/cache/crowdpose/facebook_dinov3-vits16-pretrain-lvd1689m/val.pt
cache_test: results/cache/crowdpose/facebook_dinov3-vits16-pretrain-lvd1689m/test.pt
neighborhood_radius: 1
