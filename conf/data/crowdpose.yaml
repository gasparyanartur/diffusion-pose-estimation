# CrowdPose dataset paths and data-loader settings.
# Paths are relative to the working directory (project root).

root: data
train_ann: crowdpose/annotations/crowdpose_train.json
val_ann: crowdpose/annotations/crowdpose_val.json
test_ann: crowdpose/annotations/crowdpose_test.json
img_dir: crowdpose/images

# Prediction caches for OKS-AP evaluation (produced by scripts/extract_predictions.py)
val_pred_cache: results/cache/rtmpose-m_crowdpose_val_predictions.pkl
test_pred_cache: results/cache/rtmpose-m_crowdpose_test_predictions.pkl

# AP evaluation settings
ap_batch_size: 256
ap_eval_interval: 10   # run val AP every N epochs (0 = only after training)

# DataLoader
num_workers: 4
