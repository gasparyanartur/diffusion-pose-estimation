# Optimiser, schedule, and trainer settings.

# Optimiser
lr: 1e-3
weight_decay: 1e-4
cosine_lr: true
lr_warmup_epochs: 0    # linear warmup for this many epochs before cosine decay
lr_min_frac: 1e-2      # eta_min = lr * lr_min_frac for cosine decay
cfg_guidance_scale: 1.0  # classifier-free guidance at inference; 1.0 = no guidance

# Trainer
batch_size: 256
max_epochs: 200
seed: 42
grad_clip: 1.0          # 0 = disabled
early_stop_patience: 0  # 0 = disabled

# DDIM inference (used when running AP evaluation during training)
ap_eval_interval: 100     # run AP evaluation every N epochs (0 = disabled)
num_inference_steps: 5   # null → use round(start_inference_noise_frac × num_train_steps) DDIM steps per pass
start_inference_noise_frac: 0.4  # noise frac for pass 1; halved each subsequent pass (0.4 → 0.2 → 0.1 → ...)
raw_refiner: false        # if true: skip noise, force 1 DDIM step (pure single-pass denoising)
ap_step_counts: [1, 2, 3]  # null → single-pass AP; list → evaluate at each iterative-pass count

# Logging
log_every_n_steps: 50
compile: false           # torch.compile backward_process — disabled by default; incompatible with bf16-mixed AMP

# Checkpoint smoothing
running_loss_window: 5  # window size for RunningLossLogger; monitor key = running_loss_{window}

# Resume
resume: null   # path to a .ckpt file to resume from
