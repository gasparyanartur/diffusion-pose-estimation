# Default PoseEstimator: no image features, graph-diffusion decoder.
# Override sub-trees from the command line, e.g.:
#   python ... pose_estimator.decoder.denoise_network.num_layers=6
#   python ... pose_estimator.decoder.num_train_steps=200

feature_extractor:
  _target_: src.features.NoneFeatureExtractorConfig

feature_embedder:
  _target_: src.embedders.NoneEmbedderConfig

decoder:
  _target_: src.decoders.GraphDiffusionDecoderConfig
  num_train_steps: 100
  sigma_min: 0.002
  sigma_max: 0.5
  hidden_dim: 128
  dim_pos: 128
  dim_time: 128
  dim_edge: 64
  dim_vis: 128
  dim_global_image_cond: 0
  dropout_rate: 0.1
  num_keypoints: 14

  denoise_network:
    _target_: src.decoders.GraphDenoiseNetworkConfig
    hidden_dim: 128
    num_layers: 4
    num_heads: 4
    dim_edge: 64
    dim_vis: 128
    dim_global: 128
    out_dim: 2
    dropout_rate: 0.1
    attn_dropout_rate: 0.1
