# GraphDiffusionPipelineDecoder config.
# ``image_token_dim`` and ``spatial_feat_dim`` are set automatically from
# backbone.out_channels at runtime; no manual override needed.
_target_: src.decoders.diffusion.graph_pipeline.GraphDiffusionPipelineDecoderConfig

num_slots: 20
num_keypoints: 14
dim: 256
num_heads: 8
num_trunk_blocks: 3
num_joint_blocks: 2
time_dim: 256
ffn_mult: 4.0
# Set automatically from backbone.out_channels:
image_token_dim: 768
spatial_feat_dim: 768
dim_vis: 128
dim_edge: 64
num_refiner_layers: 3
fourier_box_bands: 16
fourier_box_scale: 1000.0
fourier_joint_bands: 16
fourier_joint_scale: 1000.0
fourier_sigma_bands: 16
fourier_sigma_scale: 1.0
sigma_log_offset: 1.0e-4
pe_scale: 1000.0
dropout: 0.1
