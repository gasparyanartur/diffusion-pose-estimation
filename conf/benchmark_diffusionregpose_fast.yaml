# Fast validation configuration with the full paper architecture.
# The small data/resolution preset shortens feedback while preserving the
# checkpoint-compatible decoder and feature-level structure.

defaults:
  - pipeline: diffusionregpose
  - data: crowdpose_diffusionregpose_debug
  - hardware: auto
  - training: diffusionregpose_debug
  - _self_

run_name: diffusionregpose_fast_full
out_dir: results/diffusionregpose_fast
skip_training: false

hydra:
  run:
    dir: ${out_dir}/${run_name}/${now:%Y%m%d_%H%M%S}
  job:
    chdir: false
