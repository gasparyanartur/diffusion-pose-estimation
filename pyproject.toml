[project]
name = "posegraphdiff"
version = "0.1.0"
description = "Pose graph diffusion for keypoint refinement"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
